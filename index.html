  function shuffleWithSeed(arr, seed) {
    const a = [...arr]; let s = seed;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  const TOTAL = questions.length;
  const displayOrder = shuffleWithSeed(questions.map((_, i) => i), 42);
  let answers = new Array(TOTAL).fill(null);

  // ============ УТИЛИТЫ ============
  function localDateStamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  // ============ СКОРИНГ ============
  function effectiveValue(qIdx) {
    const raw = answers[qIdx];
    if (raw === null) return null;
    return questions[qIdx].inv ? (6 - raw) : raw;
  }
  function meanOf(sub) {
    const vals = [];
    questions.forEach((q, i) => {
      if (q.s !== sub) return;
      const v = effectiveValue(i);
      if (v !== null) vals.push(v);
    });
    if (!vals.length) return 0;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }
  function computeScores() {
    const sc = {
      self: meanOf("Self"), inter: meanOf("Inter"),
      identity: meanOf("Identity"), defenses: meanOf("Defenses"), reality: meanOf("Reality"),
      negAff: meanOf("NegAff"), detach: meanOf("Detach"),
      antag: meanOf("Antag"), disinh: meanOf("Disinh"), psycho: meanOf("Psycho"),
      socDes: meanOf("SocDes")
    };
    sc.lpfs = (sc.self + sc.inter) / 2;
    sc.structural = (sc.identity + sc.defenses + sc.reality) / 3;
    return sc;
  }

  function determineLevel(s) {
    const t = THRESHOLDS;
    if (s.reality >= t.reality.psycho) return 5;
    if (s.identity >= t.structural.l4 || s.defenses >= t.structural.l4 ||
        s.lpfs >= t.structural.l4 || s.structural >= t.structural.l4) return 4;
    if (s.identity >= t.structural.l3 || s.defenses >= t.structural.l3 ||
        s.lpfs >= t.structural.l3 || s.structural >= t.structural.l3) return 3;
    if (s.lpfs >= t.structural.l2 || s.structural >= t.structural.l2 ||
        s.negAff >= t.trait.low || s.detach >= t.trait.low ||
        s.antag >= t.trait.low || s.disinh >= t.trait.low) return 2;
    return 1;
  }

  function levelPresence(s) {
    const t = THRESHOLDS;
    return {
      1: true,
      2: s.lpfs >= t.structural.l2 || s.structural >= t.structural.l2 ||
         s.negAff >= t.trait.low || s.detach >= t.trait.low ||
         s.antag >= t.trait.low || s.disinh >= t.trait.low,
      3: s.identity >= t.structural.l3 || s.defenses >= t.structural.l3 ||
         s.lpfs >= t.structural.l3 || s.structural >= t.structural.l3,
      4: s.identity >= t.structural.l4 || s.defenses >= t.structural.l4 ||
         s.lpfs >= t.structural.l4 || s.structural >= t.structural.l4,
      5: s.reality >= t.reality.partial || s.psycho >= t.trait.med
    };
  }

      case 5: return { title: "5. Психотический уровень", text: "Нарушено тестирование реальности, возможны бредовые идеи.", rec: "Срочная консультация психиатра." };
    }
  }

  // ============ ВАЛИДНОСТЬ ============
  function carelessnessIndex() {
    const vals = answers.filter(a => a !== null);
    if (vals.length < 2) return 0;
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const variance = vals.reduce((a, b) => a + (b - mean) ** 2, 0) / vals.length;
    return Math.sqrt(variance);
  }

  // ============ ИНТЕРПРЕТАЦИЯ ============
  function interpret(value, kind) {
    const t = THRESHOLDS;
    const tag = t.status === "calibrated" ? "✓ калиброванный" : "⚠ эмпирический";
    const n = t.n ? ` (N=${t.n})` : "";

    switch (kind) {
      case "socDes":
        if (value >= t.socDes.bad) return { level: "bad", threshold: t.socDes.bad, thresholdStatus: tag + n, interpretation: `Очень высокая — данные могут быть смещены в сторону «нормы».` };
        if (value >= t.socDes.warn) return { level: "warn", threshold: t.socDes.warn, thresholdStatus: tag + n, interpretation: `Повышенная — возможно сокрытие симптоматики.` };
        return { level: "ok", threshold: t.socDes.warn, thresholdStatus: tag + n, interpretation: `В пределах нормы — отвечал(а) откровенно.` };

      case "structural":
        if (value >= t.structural.l4) return { level: "l4", threshold: t.structural.l4, thresholdStatus: tag + n, interpretation: `Соответствует нижнему пограничному уровню.` };
        if (value >= t.structural.l3) return { level: "l3", threshold: t.structural.l3, thresholdStatus: tag + n, interpretation: `Соответствует верхнему пограничному уровню.` };
        if (value >= t.structural.l2) return { level: "l2", threshold: t.structural.l2, thresholdStatus: tag + n, interpretation: `Соответствует невротическому уровню.` };
        return { level: "l1", threshold: t.structural.l2, thresholdStatus: tag + n, interpretation: `Соответствует условно здоровому уровню.` };

      case "subscale":
        if (value >= t.subscale.high) return { level: "l4", threshold: t.subscale.high, thresholdStatus: tag + n, interpretation: `Выраженность шкалы — очень высокая.` };
        if (value >= t.subscale.med) return { level: "l3", threshold: t.subscale.med, thresholdStatus: tag + n, interpretation: `Выраженность шкалы — умеренная.` };
        if (value >= t.subscale.low) return { level: "l2", threshold: t.subscale.low, thresholdStatus: tag + n, interpretation: `Выраженность шкалы — в пределах нижней нормы.` };
        return { level: "ok", threshold: t.subscale.low, thresholdStatus: tag + n, interpretation: `Выраженность шкалы — низкая.` };

      case "reality":
        if (value >= t.reality.psycho) return { level: "psycho", threshold: t.reality.psycho, thresholdStatus: tag + n, interpretation: `Выраженное нарушение тестирования реальности.` };
        if (value >= t.reality.partial) return { level: "partial", threshold: t.reality.partial, thresholdStatus: tag + n, interpretation: `Отдельные сомнения в реальности происходящего.` };
        return { level: "ok", threshold: t.reality.psycho, thresholdStatus: tag + n, interpretation: `Тестирование реальности сохранно.` };

      case "trait":
        if (value >= t.trait.high) return { level: "bad", threshold: t.trait.high, thresholdStatus: tag + n, interpretation: `Крайне выраженная черта.` };
        if (value >= t.trait.med) return { level: "warn", threshold: t.trait.med, thresholdStatus: tag + n, interpretation: `Выраженная черта.` };
        if (value >= t.trait.low) return { level: "warn", threshold: t.trait.low, thresholdStatus: tag + n, interpretation: `Умеренно выраженная черта.` };
        return { level: "ok", threshold: t.trait.low, thresholdStatus: tag + n, interpretation: `В пределах нормы.` };

      default: return { level: "info", threshold: 0, thresholdStatus: tag, interpretation: "Нет интерпретации." };
    }
  }

  function renderScoreCard(label, value, kind, barClass = "bar-struct") {
    const info = interpret(value, kind);
    const pct = Math.round((value / 5) * 100);
    const num = value.toFixed(2);

    if (DISPLAY_MODE === "raw") {
      return `<div class="score-row"><span class="score-label">${label}</span><div class="score-bar-bg"><div class="score-bar ${barClass}" style="width:${pct}%"></div></div><span class="score-val">${num}</span></div>`;
    }
    if (DISPLAY_MODE === "interpreted") {
      return `<div class="interp-only"><strong>${label}</strong><div class="interpret-line level-${info.level}"><span class="interp-tag">${info.thresholdStatus}</span>${info.interpretation}</div></div>`;
    }
    return `<div class="score-row"><span class="score-label">${label}</span><div class="score-bar-bg"><div class="score-bar ${barClass}" style="width:${pct}%"></div></div><span class="score-val">${num}</span></div>
      <div class="interpret-line level-${info.level}"><span class="interp-tag">${info.thresholdStatus}</span>${info.interpretation}</div>`;
  }

  function countSamples() {
    try { return JSON.parse(localStorage.getItem('screening_samples') || '[]').length; }
    catch { return 0; }
  }

  function collectSample(s) {
    try {
      const samples = JSON.parse(localStorage.getItem('screening_samples') || '[]');
      samples.push({
        date: new Date().toISOString(),
        socDes: s.socDes, structural: s.structural,
        identity: s.identity, defenses: s.defenses, reality: s.reality,
        negAff: s.negAff, detach: s.detach, antag: s.antag,
        disinh: s.disinh, psycho: s.psycho, lpfs: s.lpfs,
        variability: carelessnessIndex()
      });
      localStorage.setItem('screening_samples', JSON.stringify(samples));
    } catch (e) {}
  }

  function percentile(arr, p) {
    if (!arr.length) return 0;
    const sorted = [...arr].sort((a, b) => a - b);
    const idx = Math.floor((p / 100) * (sorted.length - 1));
    return sorted[idx];
  }

  function calibrateThresholds() {
    const samples = JSON.parse(localStorage.getItem('screening_samples') || '[]');
    if (samples.length < 30) { alert(`Недостаточно данных: ${samples.length} / 30.`); return false; }
    const socDesArr = samples.map(x => x.socDes);
    const structuralArr = samples.map(x => x.structural);
    const variabilityArr = samples.map(x => x.variability);
    const traitKeys = ['negAff','detach','antag','disinh','psycho'];
    const traitArr = samples.flatMap(x => traitKeys.map(k => x[k]));

    const calibrated = {
      structural: {
        l2: +percentile(structuralArr, 25).toFixed(2),
        l3: +percentile(structuralArr, 50).toFixed(2),
        l4: +percentile(structuralArr, 75).toFixed(2),
        l5: +percentile(structuralArr, 90).toFixed(2)
      },
      subscale: { ...THRESHOLDS.subscale },
      reality: { ...THRESHOLDS.reality },
      trait: {
        low: +percentile(traitArr, 50).toFixed(2),
        med: +percentile(traitArr, 75).toFixed(2),
        high: +percentile(traitArr, 90).toFixed(2)
      },
      socDes: {
        warn: +percentile(socDesArr, 75).toFixed(2),
        bad:  +percentile(socDesArr, 90).toFixed(2)
      },
      variab: {
        low:    +percentile(variabilityArr, 25).toFixed(2),
        medium: +percentile(variabilityArr, 50).toFixed(2)
      },
      status: "calibrated",
      n: samples.length,
      calibratedAt: new Date().toISOString(),
      _empirical: EMPIRICAL_THRESHOLDS
    };
    THRESHOLDS = calibrated;
    localStorage.setItem('screening_thresholds', JSON.stringify(calibrated));
    return true;
  }

  function resetThresholds() {
    THRESHOLDS = { ...JSON.parse(JSON.stringify(DEFAULT_THRESHOLDS)), _empirical: EMPIRICAL_THRESHOLDS };
    localStorage.removeItem('screening_thresholds');
  }

  // ============ ОТЧЁТ О ВАЛИДНОСТИ ============
  function validityReport(s) {
    const sd = s.socDes;
    const ci = carelessnessIndex();
    const out = [];
    const socInterp = interpret(sd, "socDes");
    out.push({ level: socInterp.level === "bad" ? "bad" : socInterp.level === "warn" ? "warn" : "ok",
      text: `Социальная желательность: ${sd.toFixed(2)}/5. [${socInterp.thresholdStatus}, порог ${socInterp.threshold.toFixed(2)}] ${socInterp.interpretation}` });
    if (ci < THRESHOLDS.variab.low) out.push({ level: "bad", text: `Вариативность ответов: ${ci.toFixed(2)} — очень низкая. Возможно «одним паттерном».` });
    else if (ci < THRESHOLDS.variab.medium) out.push({ level: "warn", text: `Вариативность ответов: ${ci.toFixed(2)} — пониженная.` });
    else out.push({ level: "ok", text: `Вариативность ответов: ${ci.toFixed(2)} — достаточная.` });
    return out;
  }

  function buildRadarChart(canvas, role, s) {
    const axes = role === "client" ? CLIENT_AXES : CLINICAL_AXES;
    const values = axes.map(a => role === "client" ? (5 - s[a.key]) : s[a.key]);
    const color = role === "client"
      ? { line: "rgba(127, 168, 127, 1)", bg: "rgba(127, 168, 127, 0.2)", point: "rgba(127, 168, 127, 1)" }
      : { line: "rgba(139, 122, 101, 1)", bg: "rgba(139, 122, 101, 0.2)", point: "rgba(163, 92, 74, 1)" };

    return new Chart(canvas, {
      type: "radar",
      data: { labels: axes.map(a => a.label), datasets: [{ label: role === "client" ? "Ваши ресурсы" : "Выраженность", data: values, backgroundColor: color.bg, borderColor: color.line, borderWidth: 2, pointBackgroundColor: color.point, pointRadius: 4 }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        scales: { r: { min: 0, max: 5, ticks: { stepSize: 1, color: "#b09a7c", font: { size: 10 } }, grid: { color: "#eae2d7" }, angleLines: { color: "#eae2d7" }, pointLabels: { color: "#4a3e35", font: { size: 11, weight: "500" } } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => role === "client" ? `Ресурс: ${ctx.raw.toFixed(2)} / 5` : `Выраженность: ${ctx.raw.toFixed(2)} / 5` } } }
      }
    });
  }

  // ============ PDF ============
  function setPdfBusy(busy) {
    ['pdf-client-btn', 'pdf-therapist-btn', 'csv-btn'].forEach(id => {
      const b = document.getElementById(id);
      if (b) { b.disabled = busy; b.style.opacity = busy ? .5 : 1; }
    });
    const status = document.getElementById('email-status');
    if (status && busy) {
      status.dataset.prevText = status.textContent;
      status.dataset.prevClass = status.className;
      status.textContent = "⏳ Готовим PDF, пожалуйста подождите…";
      status.className = "email-status info";
    } else if (status && status.dataset.prevText) {
      status.textContent = status.dataset.prevText;
      status.className = status.dataset.prevClass;
      delete status.dataset.prevText;
      delete status.dataset.prevClass;
    }
  }

  async function captureElementAsPdf(element, filename) {
    if (!element) { alert("Нет данных для экспорта."); return; }
    try {
      element.scrollIntoView({ behavior: "instant", block: "start" });
      await new Promise(r => setTimeout(r, 100));

      const canvas = await html2canvas(element, {
        scale: 1.5,
        backgroundColor: '#fdfaf7',
        useCORS: true,
        allowTaint: false,
        logging: false,
        scrollX: -window.scrollX,
        scrollY: -window.scrollY,
        windowWidth: document.documentElement.offsetWidth,
        windowHeight: element.scrollHeight
      });

      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pdfWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
      heightLeft -= pdfHeight;

      while (heightLeft > 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
        heightLeft -= pdfHeight;
      }
      pdf.save(filename);
    } catch (err) {
      console.error("PDF export error:", err);
      alert("Не удалось создать PDF: " + err.message + "\nПопробуйте уменьшить зум браузера или обновить страницу.");
    }
  }

  // ============ EMAIL ============
  async function sendEmail() {
    if (!results) return false;
    const statusEl = document.getElementById('email-status');
    if (statusEl) { statusEl.textContent = "⏳ Отправка результатов..."; statusEl.className = "email-status info"; }

    const s = results.scores;
    const presence = levelPresence(s);
    const validity = validityReport(s);
    const flags = generateRiskFlags(s);
    const defenses = generateDefenseProfile(s);
    const diff = generateDifferential(s, results.level);
    const further = generateFurtherAssessment(s, results.level);
    const strengths = generateStrengths(s);
    const attention = generateAttentionPoints(s);
    const narrative = generateClientNarrative(s, results.level);

    const presentList = LEVELS_SCALE.filter(l => presence[l.n]).map(l => `${l.n}. ${l.title}`).join("; ");

    const rawAnswers = displayOrder.map((qIdx, pos) => {
      const q = questions[qIdx];
      const v = answers[qIdx];
      const invMark = q.inv ? " [ИНВ]" : "";
      return `#${pos+1}. Q${qIdx+1} [${subTitles[q.s]}]${invMark}: ${v ?? "—"} — ${q.t}`;
    }).join("\n");

    const payload = {
      _subject: `Скрининг — ${clientName || "без имени"} — ${results.info.title}`,
      client: clientName || "не указан",
      date: new Date().toLocaleString("ru-RU"),
      display_mode: DISPLAY_MODE,
      thresholds_status: THRESHOLDS.status === "calibrated" ? `калиброванные (N=${THRESHOLDS.n}, ${new Date(THRESHOLDS.calibratedAt).toLocaleDateString('ru-RU')})` : "эмпирические",
      thresholds_empirical: `structural: l2=${EMPIRICAL_THRESHOLDS.structural.l2}, l3=${EMPIRICAL_THRESHOLDS.structural.l3}, l4=${EMPIRICAL_THRESHOLDS.structural.l4}, l5=${EMPIRICAL_THRESHOLDS.structural.l5} | socDes: warn=${EMPIRICAL_THRESHOLDS.socDes.warn}, bad=${EMPIRICAL_THRESHOLDS.socDes.bad} | trait: low=${EMPIRICAL_THRESHOLDS.trait.low}, med=${EMPIRICAL_THRESHOLDS.trait.med}, high=${EMPIRICAL_THRESHOLDS.trait.high}`,
      thresholds_used: `structural: l2=${THRESHOLDS.structural.l2}, l3=${THRESHOLDS.structural.l3}, l4=${THRESHOLDS.structural.l4}, l5=${THRESHOLDS.structural.l5} | socDes: warn=${THRESHOLDS.socDes.warn}, bad=${THRESHOLDS.socDes.bad} | trait: low=${THRESHOLDS.trait.low}, med=${THRESHOLDS.trait.med}, high=${THRESHOLDS.trait.high}`,
      level_main: results.info.title,
      levels_present: presentList,
      structural_total: s.structural.toFixed(2),
      identity: s.identity.toFixed(2),
      defenses_score: s.defenses.toFixed(2),
      reality: s.reality.toFixed(2),
      self: s.self.toFixed(2),
      inter: s.inter.toFixed(2),
      lpfs: s.lpfs.toFixed(2),
      negAff: s.negAff.toFixed(2),
      detach: s.detach.toFixed(2),
      antag: s.antag.toFixed(2),
      disinh: s.disinh.toFixed(2),
      psycho: s.psycho.toFixed(2),
      social_desirability: s.socDes.toFixed(2),
      carelessness_sd: carelessnessIndex().toFixed(2),
      validity_report: validity.map(v => `[${v.level.toUpperCase()}] ${v.text}`).join("\n\n"),
      risk_flags: flags.length ? flags.map(f => `[${f.level.toUpperCase()}] ${f.text}`).join("\n") : "не выявлено",
      defenses_profile: defenses.join("\n"),
      differential: diff.join("\n"),
      further_assessment: further.join("\n"),
      treatment_recommendation: results.info.rec,
      level_description: results.info.text,
      client_narrative: narrative,
      client_strengths: strengths.join("\n"),
      client_attention: attention.join("\n"),
      crisis_resources: generateCrisisResources().join("\n"),
      raw_answers: rawAnswers
    };

    try {
      const response = await fetch(FORMSPREE_ENDPOINT, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await response.json().catch(() => ({}));
      if (response.ok) {
        emailSent = true;
        if (statusEl) { statusEl.textContent = `✅ Результаты отправлены на ${RECIPIENT_EMAIL}`; statusEl.className = "email-status ok"; }
        return true;
      } else {
        let errMsg = data.error || response.statusText || `HTTP ${response.status}`;
        if (data.errors && Array.isArray(data.errors)) errMsg += ": " + data.errors.map(e => e.message || JSON.stringify(e)).join("; ");
        if (statusEl) { statusEl.textContent = `⚠️ Автоотправка не удалась (${errMsg}).`; statusEl.className = "email-status err"; }
        return false;
      }
    } catch (err) {
      if (statusEl) { statusEl.textContent = `⚠️ Автоотправка не удалась: ${err.message}.`; statusEl.className = "email-status err"; }
      return false;
    }
  }

  function renderQuestion() {
    const qIdx = displayOrder[idx];
    const q = questions[qIdx];
    const ans = answers[qIdx];
    const answered = answers.filter(a => a !== null).length;
    const pct = Math.round((answered / TOTAL) * 100);
    content.innerHTML = `
      <div class="progress-section">
        <span>Вопрос ${idx + 1} / ${TOTAL}</span>
        <div class="progress-bar-bg"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>
      <div class="question-text">${q.t}</div>
      <div class="likert">
        ${[1,2,3,4,5].map(v => `<label><input type="radio" name="q" value="${v}" ${ans === v ? 'checked' : ''}><span class="likert-num">${v}</span><span>${v === 1 ? "совсем не про меня" : v === 2 ? "скорее не про меня" : v === 3 ? "что-то среднее" : v === 4 ? "скорее про меня" : "очень про меня"}</span></label>`).join('')}
      </div>
      <div class="nav-buttons">
        <button id="prev-btn" ${idx === 0 ? 'disabled' : ''}>← Назад</button>
        <button id="next-btn" class="primary-btn" ${ans === null ? 'disabled' : ''}>${idx === TOTAL - 1 ? 'Завершить' : 'Далее →'}</button>
      </div>`;
    document.querySelectorAll('input[name="q"]').forEach(r => {
      r.addEventListener('change', e => {
        answers[qIdx] = parseInt(e.target.value, 10);
        document.getElementById('next-btn').disabled = false;
        setTimeout(() => {
          if (answers[qIdx] !== null) {
            if (idx < TOTAL - 1) { idx++; renderQuestion(); }
            else finish();
          }
        }, 300);
      });
    });
    const prev = document.getElementById('prev-btn');
    if (prev) prev.onclick = () => { if (idx > 0) { idx--; renderQuestion(); } };
    const next = document.getElementById('next-btn');
    next.onclick = () => {
      if (answers[qIdx] === null) return;
      if (idx < TOTAL - 1) { idx++; renderQuestion(); }
      else finish();
    };
  }

  function finish() {
    if (answers.some(a => a === null)) {
      const firstMissingDisplay = displayOrder.findIndex(qIdx => answers[qIdx] === null);
      idx = firstMissingDisplay >= 0 ? firstMissingDisplay : TOTAL - 1;
      renderQuestion();
      return;
    }
    const scores = computeScores();
    const level = determineLevel(scores);
    results = { scores, level, info: levelInfo(level) };
    activeTab = "client";
    collectSample(scores);
    renderResults();
    setTimeout(() => { sendEmail(); }, 200);
  }

  function renderLevelsTable(currentLevel, presence) {
    const rows = LEVELS_SCALE.map(l => {
      const isMain = l.n === currentLevel;
      const isPartial = !isMain && presence[l.n];
      const cls = isMain ? "active" : (isPartial ? "partial" : "");
      const mark = isMain ? "▶ Основной" : (isPartial ? "◐ Присутствует" : "—");
      return `<tr class="${cls}"><td><strong>${l.n}. ${l.title}</strong><div style="font-size:.78rem; color:#8b7a65; margin-top:2px;">${mark}</div></td><td class="range">${l.range}</td><td>${l.short}</td></tr>`;
    }).join("");
    return `
      <table class="levels-table"><thead><tr><th>Уровень</th><th>Баллы</th><th>Краткая характеристика</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="levels-legend"><span class="l-main">Основной уровень</span><span class="l-part">Присутствуют отдельные черты</span><span class="l-none">Не выражен</span></div>`;
  }

        <div class="info-card crisis"><h4>🆘 Если нужна срочная помощь</h4><ul>${generateCrisisResources().map(x => `<li>${x}</li>`).join("")}</ul></div>
        <h3>Ваш профиль по шкалам</h3>
        ${renderScoreCard("Идентичность", s.identity, "subscale", "bar-struct")}
        ${renderScoreCard("Примитивные защиты", s.defenses, "subscale", "bar-struct")}
        ${renderScoreCard("Тестирование реальности", s.reality, "reality", "bar-reality")}
        ${renderScoreCard("Самость", s.self, "subscale", "bar-struct")}
        ${renderScoreCard("Межличностное", s.inter, "subscale", "bar-struct")}
        ${renderScoreCard("Негативная аффективность", s.negAff, "trait", "bar-trait")}
        ${renderScoreCard("Отстранённость", s.detach, "trait", "bar-trait")}
        ${renderScoreCard("Антагонизм", s.antag, "trait", "bar-trait")}
        ${renderScoreCard("Расторможенность", s.disinh, "trait", "bar-trait")}
        ${renderScoreCard("Психотизм", s.psycho, "trait", "bar-trait")}
        <div class="disclaimer"><strong>Важно.</strong> Это предварительный скрининг, а не диагноз.</div>
      </div>`;
  }

  function renderTherapistPane(s, info, level) {
    const flags = generateRiskFlags(s);
    const defenses = generateDefenseProfile(s);
    const diff = generateDifferential(s, level);
    const further = generateFurtherAssessment(s, level);
    const validity = validityReport(s);

    const flagHtml = flags.length
      ? flags.map(f => `<div class="info-card ${f.level === 'high' ? 'risk-high' : 'risk-medium'}"><span class="badge ${f.level === 'high' ? 'badge-high' : 'badge-med'}">${f.level === 'high' ? 'Высокий риск' : 'Средний риск'}</span><p style="margin-top:6px;">${f.text}</p></div>`).join("")
      : `<div class="info-card"><p>Красных флагов не выявлено.</p></div>`;
    const validityHtml = validity.map(v => `<div class="info-card validity-${v.level === 'bad' ? 'bad' : v.level === 'warn' ? 'warn' : 'ok'}"><p>${v.text}</p></div>`).join("");
    const rawRows = displayOrder.map((qIdx, pos) => {
      const q = questions[qIdx];
      const v = answers[qIdx];
      const cls = v >= 4 ? "v-high" : (v === 3 ? "v-med" : "");
      const inv = q.inv ? '<span class="inv-mark">ИНВ</span>' : '';
      return `<tr><td>#${pos+1}</td><td>${subTitles[q.s]}${inv}</td><td class="${cls}">${v ?? "—"}</td><td style="font-size:.78rem; color:#8b7a65;">${q.t}</td></tr>`;
    }).join("");

    return `
      <div class="tab-pane ${activeTab === 'therapist' ? 'active' : ''}" id="pane-therapist">
        <div class="level-title">Клинический профиль · ${info.title}</div>
        <div class="chart-wrap"><canvas id="radar-therapist" data-role="radar"></canvas></div>
        <h3>Структурная диагностика (Kernberg)</h3>
        <div class="info-card">
          <p><strong>Интегральный структурный балл:</strong> ${s.structural.toFixed(2)} / 5.00</p>
          <p><strong>Идентичность:</strong> ${s.identity.toFixed(2)} · <strong>Защиты:</strong> ${s.defenses.toFixed(2)} · <strong>Реальность:</strong> ${s.reality.toFixed(2)}</p>
        </div>
        <h3>Уровень функционирования (LPFS)</h3>
        ${renderScoreCard("Самость", s.self, "subscale", "bar-struct")}
        ${renderScoreCard("Межличностное", s.inter, "subscale", "bar-struct")}
        ${renderScoreCard("Общий LPFS", s.lpfs, "subscale", "bar-struct")}
        <h3>Профиль патологических черт (PID-5)</h3>
        ${renderScoreCard("Негативная аффективность", s.negAff, "trait", "bar-trait")}
        ${renderScoreCard("Отстранённость", s.detach, "trait", "bar-trait")}
        ${renderScoreCard("Антагонизм", s.antag, "trait", "bar-trait")}
        ${renderScoreCard("Расторможенность", s.disinh, "trait", "bar-trait")}
        ${renderScoreCard("Психотизм", s.psycho, "trait", "bar-trait")}
        <h3>✅ Валидность</h3>
        ${validityHtml}
        <h3>🚩 Красные флаги</h3>
        ${flagHtml}
        <h3>🛡️ Преобладающие защитные механизмы</h3>
        <div class="info-card"><ul>${defenses.map(d => `<li>${d}</li>`).join("")}</ul></div>
        <h3>🧭 Дифференциальные гипотезы</h3>
        <div class="info-card"><ul>${diff.map(d => `<li>${d}</li>`).join("")}</ul></div>
        <h3>🔬 Рекомендации по дальнейшей диагностике</h3>
        <div class="info-card"><ul>${further.map(f => `<li>${f}</li>`).join("")}</ul></div>
        <h3>🧩 Рекомендации по лечению</h3>
        <div class="info-card"><p>${info.rec}</p></div>
        <h3>📋 Сырые ответы (в порядке предъявления)</h3>
        <table class="raw-table"><thead><tr><th>№</th><th>Подшкала</th><th>Ответ</th><th>Формулировка</th></tr></thead><tbody>${rawRows}</tbody></table>
        <div class="disclaimer" style="margin-top:18px;"><strong>Ограничения.</strong> Скрининг на основе самоотчёта. Не является диагнозом.</div>
      </div>`;
  }

  function renderResults() {
    const { scores: s, info, level } = results;
    const samplesCount = countSamples();

    const statusBanner = `
      <div class="threshold-banner ${THRESHOLDS.status === 'calibrated' ? 'calibrated' : 'empirical'}">
        <div class="tb-left">
          <strong>📊 Статус порогов:</strong>
          ${THRESHOLDS.status === 'calibrated'
            ? `✓ калиброванные (N=${THRESHOLDS.n}, ${new Date(THRESHOLDS.calibratedAt).toLocaleDateString('ru-RU')})`
            : `⚠ эмпирические (накоплено ${samplesCount} / 30)`}
        </div>
        <div class="tb-right">
          ${THRESHOLDS.status === 'calibrated'
            ? `<button id="reset-thr-btn" class="mini-btn">Сбросить к эмпирическим</button>`
            : `<button id="calibrate-btn" class="mini-btn" ${samplesCount < 30 ? 'disabled' : ''}>Пересчитать пороги</button>`}
          <label class="mode-select">
            Режим:
            <select id="display-mode">
              <option value="raw" ${DISPLAY_MODE==='raw'?'selected':''}>Только баллы</option>
              <option value="both" ${DISPLAY_MODE==='both'?'selected':''}>Баллы + интерпретация</option>
              <option value="interpreted" ${DISPLAY_MODE==='interpreted'?'selected':''}>Только интерпретация</option>
            </select>
          </label>
        </div>
      </div>`;

    content.innerHTML = `
      <div class="results-container">
        <h2 style="font-weight:400; color:#4a3e35; font-size:1.3rem;">📊 Результаты скрининга</h2>
        ${statusBanner}
        <div class="tabs">
          <button class="tab-btn ${activeTab === 'client' ? 'active' : ''}" data-tab="client">👤 Для клиента</button>
          <button class="tab-btn ${activeTab === 'therapist' ? 'active' : ''}" data-tab="therapist">🩺 Для терапевта</button>
        </div>
        ${renderClientPane(s, info, level)}
        ${renderTherapistPane(s, info, level)}
        <div class="actions">
          <button id="csv-btn">📥 CSV</button>
          <button id="pdf-client-btn">📄 PDF для клиента</button>
          <button id="pdf-therapist-btn">📄 PDF для терапевта</button>
        </div>
        <div id="email-status" class="email-status info">⏳ Отправка результатов...</div>
        <div class="refs">Концептуальная рамка: Kernberg O. (1984); DSM-5 AMPD; МКБ-11; Preti et al. (LPFS-BF 2.0); Krueger et al. (PID-5-BF); Blüml & Doering (STIPO-R); Marlowe & Crowne (1960).</div>
        <div class="nav-buttons" style="margin-top:22px;"><button id="restart-btn">🔄 Пройти заново</button></div>
      </div>`;

    document.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => showTab(btn.dataset.tab); });
    document.getElementById('calibrate-btn')?.addEventListener('click', () => {
      if (calibrateThresholds()) { alert(`Пороги пересчитаны на N=${THRESHOLDS.n}.`); renderResults(); }
    });
    document.getElementById('reset-thr-btn')?.addEventListener('click', () => {
      if (confirm('Сбросить калиброванные пороги к эмпирическим?')) { resetThresholds(); renderResults(); }
    });
    document.getElementById('display-mode')?.addEventListener('change', (e) => {
      DISPLAY_MODE = e.target.value;
      localStorage.setItem('screening_display_mode', DISPLAY_MODE);
      renderResults();
    });
    document.getElementById('csv-btn').onclick = exportCSV;
    document.getElementById('pdf-client-btn').onclick = exportClientPDF;
    document.getElementById('pdf-therapist-btn').onclick = exportTherapistPDF;
    document.getElementById('restart-btn').onclick = () => {
      answers = new Array(TOTAL).fill(null);
      idx = 0; results = null; clientName = ""; emailSent = false;
      activeTab = "client";
      if (activeChart) { activeChart.destroy(); activeChart = null; }
      renderIntro();
    };
    requestAnimationFrame(() => showTab(activeTab));
  }

  function showTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + name));
    if (activeChart) { activeChart.destroy(); activeChart = null; }
    requestAnimationFrame(() => {
      const canvas = document.querySelector('.tab-pane.active canvas[data-role="radar"]');
      if (canvas && results) activeChart = buildRadarChart(canvas, name, results.scores);
    });
  }

  renderIntro();
})();
</script>
</body>
</html>
